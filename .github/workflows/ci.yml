name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt 'pytest>=8' 'pytest-cov>=6'
      - name: Testes Python
        run: python -m pytest -q --cov=agents --cov=app --cov=core --cov=data --cov=db --cov=quant --cov-report=term-missing

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Tipos
        run: npm run lint
      - name: Testes da interface
        run: npm test
      - name: Build
        run: npm run build
