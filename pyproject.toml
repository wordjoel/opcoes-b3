[project]
name = "b3-intelligence-core"
version = "0.1.0"
description = "Núcleo de dados e motor quantitativo do B3 Opções Pro"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2",
  "scipy>=1.13",
  "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
